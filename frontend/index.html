<!DOCTYPE html>
<html>
<head>
    <title>F'in Noters</title>
    <style>
        :root {
            --c-forest: #3f6d4e;
            --c-lime: #8bd450;
            --c-night: #1d1a2f;
            --c-violet: #965fd4;
            --c-plum: #734f9a;
            --bg: var(--c-night);
            --panel: #2a2340;
            --surface: #362951;
            --surface-strong: #443066;
            --text: #f5efff;
            --muted: #cbbbe7;
            --primary: var(--c-lime);
            --secondary: var(--c-violet);
            --accent: var(--c-forest);
            --danger: var(--c-plum);
            --soft: var(--c-forest);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px;
            min-height: 100vh;
            margin: 0;
            position: relative;
            isolation: isolate;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url("bg.jpg") center / cover no-repeat;
            opacity: 0.24;
            mix-blend-mode: soft-light;
            z-index: -2;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(150, 95, 212, 0.38) 0%, rgba(29, 26, 47, 0.78) 45%, rgba(23, 19, 39, 0.86) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: min(1280px, 96vw);
            background: linear-gradient(170deg, rgba(42, 35, 64, 0.72) 0%, rgba(29, 26, 47, 0.66) 100%);
            border: 1px solid rgba(150, 95, 212, 0.28);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 22px 40px rgba(12, 9, 24, 0.34);
            position: relative;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        h1 {
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 0;
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 10px;
            border: 1px solid rgba(150, 95, 212, 0.28);
            outline: none;
            background: rgba(54, 41, 81, 0.55);
            color: var(--text);
            box-sizing: border-box;
        }

        input::placeholder, textarea::placeholder {
            color: rgba(203, 187, 231, 0.85);
        }

        textarea {
            resize: none;
            height: 80px;
        }

        .buttons {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .save {
            background: var(--primary);
            color: #1d1a2f;
        }

        .cancel {
            background: var(--soft);
            color: #fff;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .note-preview {
            background: linear-gradient(165deg, rgba(68, 48, 102, 0.68) 0%, rgba(54, 41, 81, 0.58) 100%);
            padding: 15px;
            border-radius: 12px;
            position: relative;
            border: 1px solid rgba(150, 95, 212, 0.25);
            aspect-ratio: 1 / 1;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .note-preview:hover {
            transform: translateY(-2px);
            border-color: rgba(139, 212, 80, 0.85);
        }

        .note-preview h3 {
            margin: 0;
            font-size: 16px;
            line-height: 1.25;
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-preview p {
            margin: 10px 0 0;
            color: #e4d9f6;
            flex: 1;
            line-height: 1.35;
            font-size: 14px;
            display: -webkit-box;
            line-clamp: 5;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-preview small {
            color: var(--primary);
            font-size: 12px;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            margin-top: 20px;
            padding: 30px 10px;
            border: 1px dashed rgba(139, 212, 80, 0.6);
            background: rgba(54, 41, 81, 0.32);
            border-radius: 12px;
        }

        .fab {
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: 58px;
            height: 58px;
            border-radius: 999px;
            font-size: 30px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 14px 28px rgba(13, 11, 24, 0.55);
            background: linear-gradient(135deg, var(--primary), #6dab49);
            color: #1d1a2f;
            z-index: 40;
        }

        .fab:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(23, 19, 39, 0.56);
            z-index: 30;
            padding: 14px;
            box-sizing: border-box;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: 520px;
            max-width: 100%;
            background: linear-gradient(180deg, rgba(42, 35, 64, 0.76) 0%, rgba(36, 30, 56, 0.72) 100%);
            border-radius: 16px;
            padding: 22px;
            border: 1px solid rgba(150, 95, 212, 0.34);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-card h2 {
            margin: 0 0 4px;
        }

        .modal-card p {
            margin: 0;
            color: var(--muted);
        }

        .view-title {
            margin: 0;
        }

        .view-date {
            margin-top: 4px;
            color: var(--primary);
            font-size: 13px;
        }

        .view-content {
            margin-top: 12px;
            background: rgba(54, 41, 81, 0.5);
            border-radius: 12px;
            padding: 14px;
            line-height: 1.5;
            max-height: 50vh;
            overflow: auto;
            white-space: pre-wrap;
            border: 1px solid rgba(139, 212, 80, 0.28);
        }

        .danger {
            background: var(--danger);
            color: #fff;
        }

        .edit {
            background: var(--secondary);
            color: #fff;
        }

        @media (max-width: 1100px) {
            .notes-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 860px) {
            .notes-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 18px;
            }

            .container {
                padding: 16px;
            }

            .notes-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .fab {
                right: 18px;
                bottom: 18px;
            }
        }

        @media (max-width: 420px) {
            .notes-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Notes</h1>
    <p class="subtitle">By Elyuzar.</p>

    <div id="notesContainer" class="notes-grid"></div>
</div>

<button class="fab" id="addBtn" onclick="openAddModal()" aria-label="Tambah catatan">+</button>

<div class="modal" id="noteModal" onclick="closeModalFromBackdrop(event, 'noteModal')">
    <div class="modal-card">
        <h2 id="modalTitle">Add Note</h2>
        <p>Write your note and save it.</p>
        <input id="judul" placeholder="Judul...">
        <textarea id="isi" placeholder="Tulis sesuatu..."></textarea>

        <div class="buttons">
            <button class="cancel" onclick="cancelEdit()" id="cancelBtn">Cancel</button>
            <button class="save" onclick="saveNote()">Simpan</button>
        </div>
    </div>
</div>

<div class="modal" id="viewModal" onclick="closeModalFromBackdrop(event, 'viewModal')">
    <div class="modal-card">
        <h2 class="view-title" id="viewTitle"></h2>
        <p class="view-date" id="viewDate"></p>
        <div class="view-content" id="viewBody"></div>
        <div class="buttons">
            <button class="danger" onclick="deleteSelectedNote()">Delete</button>
            <button class="edit" onclick="startEditFromView()">Edit</button>
            <button class="cancel" onclick="closeViewModal()">Close</button>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
